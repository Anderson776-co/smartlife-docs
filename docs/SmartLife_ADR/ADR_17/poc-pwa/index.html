<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SmartLife - PoC PWA</title>
<link rel="manifest" href="manifest.json">
</head>
<body>
<h1>SmartLife - Registro de Visitas</h1>
<p id="estado">Verificando conexion...</p>
<h3>Registrar ingreso de visitante</h3>
<input type="text" id="nombreVisitante" placeholder="Nombre del visitante">
<button onclick="registrarVisita()">Registrar ingreso</button>
<h3>Registros pendientes de sincronizar</h3>
<ul id="listaPendientes"></ul>
<button onclick="verPendientes()">Actualizar lista</button>
<script>
let db;
const request = indexedDB.open("smartlife-visitas-db", 1);
request.onupgradeneeded = function(event) {
db = event.target.result;
db.createObjectStore("pendientes", { keyPath: "id", autoIncrement: true });
};
request.onsuccess = function(event) {
db = event.target.result;
console.log("IndexedDB abierta correctamente");
verPendientes();
};
request.onerror = function(event) {
console.log("Error al abrir IndexedDB:", event.target.error);
};
function registrarVisita() {
const nombre = document.getElementById("nombreVisitante").value;
if (!nombre) { alert("Escribe un nombre"); return; }
const registro = { nombre: nombre, fecha: new Date().toISOString(), estado: "pendiente" };
const tx = db.transaction("pendientes", "readwrite");
tx.objectStore("pendientes").add(registro);
tx.oncomplete = function() {
console.log("Registro guardado en IndexedDB:", registro);
document.getElementById("nombreVisitante").value = "";
verPendientes();
};
}
function verPendientes() {
const tx = db.transaction("pendientes", "readonly");
const store = tx.objectStore("pendientes");
const lista = document.getElementById("listaPendientes");
lista.innerHTML = "";
store.openCursor().onsuccess = function(event) {
const cursor = event.target.result;
if (cursor) {
const li = document.createElement("li");
li.innerText = cursor.value.nombre + " - " + cursor.value.fecha + " - Estado: " + cursor.value.estado;
lista.appendChild(li);
cursor.continue();
}
};
}
function sincronizarPendientes() {
console.log("[SYNC] Conexion restablecida, buscando registros pendientes...");
const tx = db.transaction("pendientes", "readwrite");
const store = tx.objectStore("pendientes");
store.openCursor().onsuccess = function(event) {
const cursor = event.target.result;
if (cursor) {
if (cursor.value.estado === "pendiente") {
console.log("[SYNC] Enviando al servidor (simulado):", cursor.value.nombre);
const actualizado = cursor.value;
actualizado.estado = "sincronizado";
cursor.update(actualizado);
}
cursor.continue();
} else {
console.log("[SYNC] Sincronizacion completada.");
verPendientes();
}
};
}
if ("serviceWorker" in navigator) {
navigator.serviceWorker.register("sw.js")
.then(function() { console.log("Service Worker registrado correctamente"); })
.catch(function(err) { console.log("Error al registrar Service Worker:", err); });
}
function actualizarEstado() {
const conectado = navigator.onLine;
document.getElementById("estado").innerText = conectado ? "Estado: CONECTADO" : "Estado: SIN CONEXION (funcionando en modo offline)";
if (conectado && db) {
sincronizarPendientes();
}
}
window.addEventListener("online", actualizarEstado);
window.addEventListener("offline", actualizarEstado);
actualizarEstado();
</script>
</body>
</html>
